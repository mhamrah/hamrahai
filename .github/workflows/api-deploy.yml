name: API - Cloud Run Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REGISTRY: ${{ vars.GAR_REGISTRY }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
  TIDAL_CLIENT_ID: ${{ vars.TIDAL_CLIENT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Validate release configuration
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$SPOTIFY_CLIENT_ID"
          test -n "$TIDAL_CLIENT_ID"
          test -n "${{ vars.NEON_PROJECT_ID }}"
          test -n "${{ vars.NEON_PARENT_BRANCH }}"
          test -n "${{ secrets.NEON_API_KEY }}"

      - name: Set Neon branch expiration
        run: echo "NEON_EXPIRES_AT=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon release validation branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: api-release-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Format check
        working-directory: packages/api
        run: cargo fmt --check

      - name: Install SQLx CLI
        working-directory: packages/api
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked

      - name: Run migrations on Neon release validation branch
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: sqlx migrate run --database-url "$DATABASE_URL"

      - name: Clippy
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          JWT_SECRET: test-jwt-secret-for-api-release-validation
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          JWT_SECRET: test-jwt-secret-for-api-release-validation
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo test

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push image
        working-directory: packages/api
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Render Cloud Run environment configuration
        run: |
          envsubst < packages/api/deploy/cloud-run.runtime.yaml.tmpl > "$RUNNER_TEMP/cloud-run.env.yaml"
          test -s "$RUNNER_TEMP/cloud-run.env.yaml"
          ! grep -q '\${' "$RUNNER_TEMP/cloud-run.env.yaml"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --port 8080 \
            --cpu-throttling \
            --startup-probe httpGet.path=/readyz,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=10,timeoutSeconds=3,failureThreshold=18 \
            --liveness-probe httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=30,periodSeconds=30,timeoutSeconds=3,failureThreshold=3 \
            --env-vars-file "$RUNNER_TEMP/cloud-run.env.yaml" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest,MUSIC_TOKEN_ENCRYPTION_KEY=MUSIC_TOKEN_ENCRYPTION_KEY:latest"

      - name: Delete Neon release validation branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
