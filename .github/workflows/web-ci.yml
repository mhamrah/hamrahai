name: Web - CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main, develop]

jobs:
  web:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Detect web changes
        id: changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(packages/web/|packages/shared/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/web-ci\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip web pipeline
        if: steps.changes.outputs.should_run != 'true'
        working-directory: .
        run: echo "No web package changes detected."

      - name: Install pnpm
        if: steps.changes.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile --config.trust-lockfile=true

      - name: Build application
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm build

      - name: Run linting
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm lint

      - name: Run type checking
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm build.types

      - name: Run unit tests
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm test:run

      - name: Generate test coverage
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: steps.changes.outputs.should_run == 'true'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/web/coverage/lcov.info
          fail_ci_if_error: false

      - name: Start development server
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm exec wrangler pages dev ./dist --port 5173 --ip 127.0.0.1 &
        env:
          NODE_ENV: production

      - name: Wait for server to be ready
        if: steps.changes.outputs.should_run == 'true'
        run: |
          timeout 60s bash -c 'until curl -f http://127.0.0.1:5173/; do sleep 2; done'

      - name: Run E2E tests
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm exec playwright test
        env:
          HOME: /root
          NODE_ENV: test
          HAMRAH_E2E_BASE_URL: http://127.0.0.1:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.1
        if: always() && steps.changes.outputs.should_run == 'true'
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30

      - name: Run security audit
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm audit --audit-level moderate

      - name: Initialize CodeQL
        if: steps.changes.outputs.should_run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.changes.outputs.should_run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

      - name: Upload build artifacts
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-files
          path: |
            packages/web/dist/
            packages/web/.output/
          retention-days: 7

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.changes.outputs.should_run == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bf376701ff33d2abb2c6e07ef0d6f3e7
