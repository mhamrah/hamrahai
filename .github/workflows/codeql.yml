name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      javascript_typescript: ${{ steps.filter.outputs.javascript_typescript }}
      rust: ${{ steps.filter.outputs.rust }}
      swift: ${{ steps.filter.outputs.swift }}

    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            javascript_typescript:
              - 'packages/web/**'
            rust:
              - 'packages/api/**'
            swift:
              - 'packages/ios/**'

  javascript-typescript:
    name: Analyze JavaScript/TypeScript
    needs: changes
    if: needs.changes.outputs.javascript_typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  rust:
    name: Analyze Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  swift:
    name: Analyze Swift
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    env:
      PROJECT_PATH: packages/ios/hamrah-ios.xcodeproj
      SCHEME: hamrah-ios
      DERIVED_DATA_PATH: /tmp/CodeQLDerivedData
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disablePackageRepositoryCache

      - name: Build iOS app for analysis
        run: |
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"

  quality-gate:
    name: CodeQL quality gate
    needs: [changes, javascript-typescript, rust, swift]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      security-events: read

    steps:
      - name: Verify required CodeQL analyses completed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JAVASCRIPT_TYPESCRIPT_CHANGED: ${{ needs.changes.outputs.javascript_typescript }}
          JAVASCRIPT_TYPESCRIPT_RESULT: ${{ needs.javascript-typescript.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          SWIFT_CHANGED: ${{ needs.changes.outputs.swift }}
          SWIFT_RESULT: ${{ needs.swift.result }}
        run: |
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "CodeQL change detection must succeed (result: ${CHANGES_RESULT:-missing})." >&2
            exit 1
          fi

          require_success() {
            local language="$1"
            local changed="$2"
            local result="$3"

            if [[ "${changed}" == "true" ]]; then
              if [[ "${result}" != "success" ]]; then
                echo "${language} CodeQL analysis must succeed (result: ${result:-missing})." >&2
                exit 1
              fi
            fi
          }

          require_success "JavaScript/TypeScript" "${JAVASCRIPT_TYPESCRIPT_CHANGED}" "${JAVASCRIPT_TYPESCRIPT_RESULT}"
          require_success "Rust" "${RUST_CHANGED}" "${RUST_RESULT}"
          require_success "Swift" "${SWIFT_CHANGED}" "${SWIFT_RESULT}"

      - name: Enforce CodeQL alert thresholds
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          violations="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?tool_name=CodeQL&pr=${PR_NUMBER}&state=open&per_page=100" \
            --jq '.[] | select(.rule.severity == "error" or .rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | "\(.rule.id) (severity: \(.rule.severity), security severity: \(.rule.security_severity_level // "none")) \(.html_url)"')"

          if [[ -n "${violations}" ]]; then
            echo "CodeQL found pull-request alerts at the protected thresholds:" >&2
            echo "${violations}" >&2
            exit 1
          fi
