name: API - Cloud Run Deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REGISTRY: ${{ vars.GAR_REGISTRY }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LOCAL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hamrah_release
      NEON_CONFIGURED: ${{ vars.NEON_PROJECT_ID != '' && vars.NEON_PARENT_BRANCH != '' && secrets.NEON_API_KEY != '' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hamrah_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Validate release configuration
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "::error::APPLE_TEAM_ID repository variable is required for production App Attest verification."
            exit 1
          fi

      - name: Set Neon branch expiration
        if: env.NEON_CONFIGURED == 'true'
        run: echo "NEON_EXPIRES_AT=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon release validation branch
        if: env.NEON_CONFIGURED == 'true'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: api-release-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Format check
        working-directory: packages/api
        run: cargo fmt --check

      - name: Install SQLx CLI
        working-directory: packages/api
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked

      - name: Select API release validation database
        run: |
          if [ "${NEON_CONFIGURED}" = "true" ]; then
            echo "DATABASE_URL=${{ steps.neon.outputs.db_url }}" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=${LOCAL_DATABASE_URL}" >> "$GITHUB_ENV"
          fi

      - name: Run migrations on API release validation database
        working-directory: packages/api
        run: sqlx migrate run --database-url "$DATABASE_URL"

      - name: Clippy
        working-directory: packages/api
        env:
          JWT_SECRET: test-jwt-secret-for-api-release-validation
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: packages/api
        env:
          JWT_SECRET: test-jwt-secret-for-api-release-validation
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo test

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push image
        working-directory: packages/api
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --image ${{ env.IMAGE }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --port 8080 \
            --cpu-throttling \
            --startup-probe httpGet.path=/readyz,httpGet.port=8080,initialDelaySeconds=10,periodSeconds=10,timeoutSeconds=3,failureThreshold=18 \
            --liveness-probe httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=30,periodSeconds=30,timeoutSeconds=3,failureThreshold=3 \
            --set-env-vars "RUST_LOG=info,APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest"

      - name: Delete Neon release validation branch
        if: always() && env.NEON_CONFIGURED == 'true' && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
