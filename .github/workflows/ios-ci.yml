name: iOS CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    env:
      PROJECT_PATH: packages/ios/hamrah-ios.xcodeproj
      SCHEME: hamrah-ios
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Detect iOS changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(packages/ios/|\.github/workflows/ios-ci\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip iOS tests
        if: steps.changes.outputs.should_run != 'true'
        run: echo "No iOS package changes detected."

      - name: Select Xcode
        if: steps.changes.outputs.should_run == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Configure build paths
        if: steps.changes.outputs.should_run == 'true'
        run: echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      - name: Validate export compliance declaration
        if: steps.changes.outputs.should_run == 'true'
        run: |
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw packages/ios/hamrah-ios/Info.plist)" = "false"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw packages/ios/hamrah-share/Info.plist)" = "false"

      - name: Resolve Swift packages
        if: steps.changes.outputs.should_run == 'true'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disablePackageRepositoryCache

      - name: Initialize CodeQL
        if: steps.changes.outputs.should_run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build iOS app
        if: steps.changes.outputs.should_run == 'true'
        run: |
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS tests
        if: steps.changes.outputs.should_run == 'true'
        run: |
          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "$RUNNER_TEMP/hamrah-ios-tests.xcresult" \
            -skip-testing:hamrah-ios-uitests

      - name: Upload test results
        if: always() && steps.changes.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hamrah-ios-tests
          path: ${{ runner.temp }}/hamrah-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Perform CodeQL Analysis
        if: steps.changes.outputs.should_run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"

  testflight:
    name: Build and Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    needs: ios-tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    env:
      PROJECT_PATH: packages/ios/hamrah-ios.xcodeproj
      SCHEME: hamrah-ios
      EXPORT_OPTIONS: packages/ios/ExportOptions.plist
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate App Store Connect secrets
        run: |
          test -n "${ASC_KEY_ID}"
          test -n "${ASC_ISSUER_ID}"
          test -n "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}"

      - name: Configure build paths
        run: |
          echo "ARCHIVE_PATH=$RUNNER_TEMP/hamrah-ios.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/testflight-export" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disablePackageRepositoryCache

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
