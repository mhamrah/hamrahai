name: iOS - TestFlight Deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/ios/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build, Test, and Upload
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      PROJECT_PATH: packages/ios/hamrah-ios.xcodeproj
      SCHEME: hamrah-ios
      EXPORT_OPTIONS: packages/ios/ExportOptions.plist
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate App Store Connect secrets
        run: |
          test -n "${ASC_KEY_ID}"
          test -n "${ASC_ISSUER_ID}"
          test -n "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}"

      - name: Configure build paths
        run: |
          echo "ARCHIVE_PATH=$RUNNER_TEMP/hamrah-ios.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/testflight-export" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disablePackageRepositoryCache

      - name: Select iPhone simulator
        run: |
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,name=iPhone 16,OS=latest" >> "$GITHUB_ENV"

      - name: Run iOS tests
        run: |
          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "$RUNNER_TEMP/hamrah-ios-tests.xcresult" \
            -skip-testing:hamrah-ios-uitests

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${ASC_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hamrah-ios-tests
          path: ${{ runner.temp }}/hamrah-ios-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14
