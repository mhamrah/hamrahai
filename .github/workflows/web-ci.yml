name: Web - CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.trust-lockfile=true

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm build.types

      - name: Run unit tests
        run: pnpm test:run

      - name: Generate test coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/web/coverage/lcov.info
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.trust-lockfile=true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build application
        run: pnpm build

      - name: Start development server
        run: pnpm exec wrangler pages dev ./dist --port 5173 --ip 127.0.0.1 &
        env:
          NODE_ENV: production

      - name: Wait for server to be ready
        run: |
          timeout 60s bash -c 'until curl -f http://127.0.0.1:5173/; do sleep 2; done'

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          HAMRAH_E2E_BASE_URL: http://127.0.0.1:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, e2e-tests]
    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.trust-lockfile=true

      - name: Build application
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-files
          path: |
            packages/web/dist/
            packages/web/.output/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.trust-lockfile=true

      - name: Run security audit
        run: pnpm audit --audit-level moderate
