name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "22 9 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read
  security-events: write

jobs:
  changes:
    name: Detect changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      swift: ${{ steps.filter.outputs.swift }}

    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'packages/api/**'
            swift:
              - 'packages/ios/**'

  javascript-typescript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  rust:
    name: Analyze Rust
    needs: changes
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  swift:
    name: Analyze Swift
    needs: changes
    if: >-
      always() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.swift == 'true')
    runs-on: macos-26
    timeout-minutes: 45

    env:
      PROJECT_PATH: packages/ios/hamrah-ios.xcodeproj
      SCHEME: hamrah-ios
      DERIVED_DATA_PATH: /tmp/CodeQLDerivedData
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disablePackageRepositoryCache

      - name: Build iOS app for analysis
        run: |
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "${IOS_TEST_DESTINATION}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
