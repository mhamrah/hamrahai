name: API - Cloud Run Deploy

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  REGISTRY: ${{ vars.GAR_REGISTRY }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
  TIDAL_CLIENT_ID: ${{ vars.TIDAL_CLIENT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Validate release configuration
        run: |
          test -n "$APPLE_TEAM_ID"
          test -n "$SPOTIFY_CLIENT_ID"
          test -n "$TIDAL_CLIENT_ID"
          test -n "${{ vars.NEON_PROJECT_ID }}"
          test -n "${{ vars.NEON_PARENT_BRANCH }}"
          test -n "${{ secrets.NEON_API_KEY }}"

      - name: Set Neon branch expiration
        run: echo "NEON_EXPIRES_AT=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon release validation branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: api-release-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Format check
        working-directory: packages/api
        run: cargo fmt --check

      - name: Install SQLx CLI
        working-directory: packages/api
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked

      - name: Run migrations on Neon release validation branch
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: sqlx migrate run --database-url "$DATABASE_URL"

      - name: Clippy
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          JWT_SECRET: test-jwt-secret-for-api-release-validation
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          JWT_SECRET: test-jwt-secret-for-api-release-validation
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo test

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push image
        working-directory: packages/api
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          test -n "$IMAGE_DIGEST"
          IMAGE_REPOSITORY="${IMAGE%:*}"
          echo "IMAGE_DIGEST=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"

      - name: Apply Cloud Deploy pipeline configuration
        run: |
          gcloud deploy apply \
            --file packages/api/deploy/clouddeploy.yaml \
            --project "$PROJECT_ID" \
            --region "$REGION"

      - name: Create Cloud Deploy release
        run: |
          RELEASE="api-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
          gcloud deploy releases create "$RELEASE" \
            --delivery-pipeline hamrah-api \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source packages/api/deploy \
            --images "hamrah-api=$IMAGE_DIGEST" \
            --deploy-parameters "apple_team_id=$APPLE_TEAM_ID,spotify_client_id=$SPOTIFY_CLIENT_ID,tidal_client_id=$TIDAL_CLIENT_ID"

      - name: Delete Neon release validation branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
