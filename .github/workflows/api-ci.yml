name: API - CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "packages/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main, develop]

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build production container
        uses: docker/build-push-action@v7
        with:
          context: packages/api
          push: false

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LOCAL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hamrah_ci
      NEON_CONFIGURED: ${{ vars.NEON_PROJECT_ID != '' && vars.NEON_PARENT_BRANCH != '' && secrets.NEON_API_KEY != '' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hamrah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/api

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Detect API changes
        id: changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(packages/api/|\.github/workflows/api-ci\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Rust dependencies
        if: steps.changes.outputs.should_run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: api
          workspaces: packages/api -> target

      - name: Skip API tests
        if: steps.changes.outputs.should_run != 'true'
        working-directory: .
        run: echo "No API package changes detected."

      - name: Set Neon branch expiration
        if: steps.changes.outputs.should_run == 'true' && env.NEON_CONFIGURED == 'true'
        working-directory: .
        run: echo "NEON_EXPIRES_AT=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Node.js for Neon CLI
        if: steps.changes.outputs.should_run == 'true' && env.NEON_CONFIGURED == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install Neon CLI
        if: steps.changes.outputs.should_run == 'true' && env.NEON_CONFIGURED == 'true'
        working-directory: .
        run: npm install --global --ignore-scripts neonctl@2.22.0

      - name: Create Neon test branch
        if: steps.changes.outputs.should_run == 'true' && env.NEON_CONFIGURED == 'true'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: api-ci-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Select API test database
        if: steps.changes.outputs.should_run == 'true'
        working-directory: .
        run: |
          if [ "${NEON_CONFIGURED}" = "true" ]; then
            echo "DATABASE_URL=${{ steps.neon.outputs.db_url }}" >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=${LOCAL_DATABASE_URL}" >> "$GITHUB_ENV"
          fi

      - name: Format check
        if: steps.changes.outputs.should_run == 'true'
        run: cargo fmt --check

      - name: Install SQLx CLI
        if: steps.changes.outputs.should_run == 'true'
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked

      - name: Run migrations on API test database
        if: steps.changes.outputs.should_run == 'true'
        run: sqlx migrate run --database-url "$DATABASE_URL"

      - name: Clippy
        if: steps.changes.outputs.should_run == 'true'
        env:
          JWT_SECRET: test-jwt-secret-for-api-ci
          APPLE_TEAM_ID: TEAMID1234
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo clippy -- -D warnings

      - name: Run tests
        if: steps.changes.outputs.should_run == 'true'
        env:
          JWT_SECRET: test-jwt-secret-for-api-ci
          APPLE_TEAM_ID: TEAMID1234
          ALLOW_UNATTESTED_IOS_REQUESTS: "true"
        run: cargo test

      - name: Delete Neon test branch
        if: always() && steps.changes.outputs.should_run == 'true' && env.NEON_CONFIGURED == 'true' && steps.neon.outputs.branch_id != ''
        working-directory: .
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: neonctl branches delete "$NEON_BRANCH_ID" --project-id "$NEON_PROJECT_ID"
