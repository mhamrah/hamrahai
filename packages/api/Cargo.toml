[package]
name = "hamrah-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Database
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "chrono"] }
dotenvy = "0.15"
# Auth & Security
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "10"
rand = "0.10"
base64 = "0.22"
sha2 = "0.11"
webauthn-rs = { version = "0.6.1-dev", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.6.1-dev"
# Apple App Attestation
appattest-rs = "0.1.0"
# Misc
anyhow = "1"
thiserror = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
